name: Build Project

on:
  push:
    branches: [ 'main', 'dev' ]
    tags: [ 'v*' ] # <-- Tells GitHub to listen for version tags
  pull_request:
    branches: [ 'main', 'dev' ]
  workflow_dispatch: 

# Suppress Node 20 deprecation warnings until third-party actions update to Node 24
env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

defaults:
  run:
    shell: pwsh

jobs:
  build:
    name: Build Application
    runs-on: windows-latest # <-- Provisions the VS 2026 / v145 toolset
    if: |
      !contains(github.event.head_commit.message, '***NO_CI***') &&
      !contains(github.event.head_commit.message, '[skip ci]')
    steps:
      # 1. Checkout repository first
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      # 2. Setup build tools
      - name: Set up build environment
        uses: microsoft/setup-msbuild@v2
        
      - name: Set up NuGet
        uses: nuget/setup-nuget@v2

      # 3. Clone and Bootstrap vcpkg
      - name: Setup and Bootstrap vcpkg
        run: |
          # Create the directory if it doesn't exist
          New-Item -ItemType Directory -Force -Path extern
          
          # Clone vcpkg directly
          git clone https://github.com/microsoft/vcpkg.git extern/vcpkg
          
          # Bootstrap and integrate
          cd extern\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg integrate install

      # 4. Build Core Application
      - name: Build Core Application
        run: |
          msbuild nextxi.sln -t:'restore;build' -p:configuration=release -p:PlatformToolset=v143 -p:TreatWarningsAsErrors=false -p:RunCodeAnalysis=false -p:ReleaseBuild=true -m -nowarn:NU1503
          
      # 5. Setup .NET 10 and Publish the Launcher as Self-Contained for WINE/Proton
      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish Launcher
        run: |
          dotnet publish launcher/launcher.csproj `
            -c Release `
            -r win-x86 `
            --self-contained true `
            -o build/bin/release/

      # 6. Build Installer
      - name: Build Installer
        run: |
          nuget restore installer.sln
          msbuild installer.sln -t:'build' -p:configuration=release -m -nowarn:NU1503

      # 7. Upload Artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compiled-binaries
          path: build/bin/release/

      # --- Automated Release Pipeline ---
      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/release/windower.msi
            build/bin/release/windower.zip
            build/bin/release/windower.portable.zip
          generate_release_notes: true
